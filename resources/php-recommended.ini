; Recommended PHP configuration for PocketMine-Fenix
; Place this file next to your php binary as php.ini, or merge with your existing config.
;
; The single biggest performance improvement for PocketMine-Fenix is enabling
; OPcache with JIT. On typical hardware this gives 15-30% higher TPS.

; === Required ===
memory_limit = 1024M or more

; === OPcache (huge performance win) ===
; Enable the opcode cache - avoids re-parsing PHP files on every request
opcache.enable = 1
opcache.enable_cli = 1

; JIT (Just-In-Time compilation) - PHP 8.0+
; tracing JIT is the best mode for server workloads
opcache.jit = tracing
opcache.jit_buffer_size = 128M

; Cache more files between requests
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.enable_file_override = 1

; === Garbage collection ===
; Let PM's internal GC handle cycle collection; disable PHP's automatic one
; to avoid random stuttering (PM triggers it at controlled intervals)
zend.enable_gc = 0

; === Misc ===
; Required by PocketMine-Fenix
extension = chunkutils2
extension = pmmpthread
extension = encoding
extension = igbinary
extension = leveldb
extension = morton
